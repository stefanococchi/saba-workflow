<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ workflow.name }} - Saba Workflow</title>
    <style>
        {{ custom_css | safe }}
    </style>
</head>
<body>
    <script>
    window.__sabaPayment = {{ (payment_config or {})|tojson }};
    // If payment is enabled, intercept ALL form submits in CAPTURE phase
    // (runs before the inline submit script embedded in custom_html)
    if (window.__sabaPayment && window.__sabaPayment.enabled && !window.__sabaPayment.already_paid) {
        document.addEventListener('submit', function(e) {
            var form = e.target;
            if (!form.classList.contains('saba-landing-form')) return;

            // Check conditional payment: if a condition field is set, only require
            // payment when the field matches the expected value
            var _pm = window.__sabaPayment;
            if (_pm.condition_field) {
                var fd = new FormData(form);
                var fv = fd.getAll(_pm.condition_field).join(',');
                if (String(fv).toLowerCase() !== String(_pm.condition_value).toLowerCase()) {
                    return; // condition not met — let the normal submit handler run
                }
            }

            e.preventDefault();
            e.stopImmediatePropagation();

            if (window.__sabaPaymentSubmitting) return;
            window.__sabaPaymentSubmitting = true;

            var btn = form.querySelector('[type="submit"]');
            if (btn) { btn.disabled = true; btn.textContent = 'Redirecting to payment...'; }

            var fd = new FormData(form);
            var data = {};
            var filePromises = [];
            fd.forEach(function(v, k) {
                if (v instanceof File && v.size > 0) {
                    filePromises.push(new Promise(function(ok, fail) {
                        var r = new FileReader();
                        r.onload = function() { data[k] = {filename: v.name, mime: v.type, size: v.size, data: r.result}; ok(); };
                        r.onerror = fail;
                        r.readAsDataURL(v);
                    }));
                } else if (!(v instanceof File)) {
                    if (data[k]) { if (!Array.isArray(data[k])) data[k] = [data[k]]; data[k].push(v); }
                    else data[k] = v;
                }
            });

            Promise.all(filePromises).then(function() {
                return fetch(window.location.pathname + '/checkout', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
            }).then(function(r) {
                if (r.ok) return r.json();
                return r.json().then(function(err) { throw new Error(err.error || 'Payment error'); });
            }).then(function(result) {
                window.location.href = result.checkout_url;
            }).catch(function(err) {
                var em = document.querySelector('.saba-error-msg');
                if (em) { em.textContent = err.message || 'Payment error'; em.style.display = 'block'; }
                if (btn) { btn.disabled = false; btn.textContent = 'Retry'; }
                window.__sabaPaymentSubmitting = false;
            });
        }, true); // CAPTURE phase — runs before bubble-phase listeners
    }
    </script>

    {{ custom_html | safe }}

    <script>
    (function() {
        var _submitting = false;
        var _payment = window.__sabaPayment || {};

        // must_be validation: block submit if select/radio value doesn't match required value
        function validateMustBe(form) {
            var ok = true;
            // Select dropdowns with data-must-be
            form.querySelectorAll('select[data-must-be]').forEach(function(sel) {
                var required = sel.getAttribute('data-must-be');
                var hint = sel.parentElement.querySelector('.must-be-hint');
                if (sel.value !== required) {
                    ok = false;
                    sel.style.borderColor = '#c62828';
                    if (hint) hint.style.display = 'block';
                } else {
                    sel.style.borderColor = '';
                    if (hint) hint.style.display = 'none';
                }
            });
            // Radio button groups with data-must-be
            form.querySelectorAll('[data-radio-group][data-must-be]').forEach(function(group) {
                var required = group.getAttribute('data-must-be');
                var name = group.getAttribute('data-radio-group');
                var checked = group.querySelector('input[name="' + name + '"]:checked');
                var hint = group.querySelector('.must-be-hint');
                if (!checked || checked.value !== required) {
                    ok = false;
                    group.style.borderLeft = '3px solid #c62828';
                    group.style.paddingLeft = '8px';
                    if (hint) hint.style.display = 'block';
                } else {
                    group.style.borderLeft = '';
                    group.style.paddingLeft = '';
                    if (hint) hint.style.display = 'none';
                }
            });
            return ok;
        }

        // Live feedback on change for must_be fields
        document.querySelectorAll('select[data-must-be]').forEach(function(sel) {
            sel.addEventListener('change', function() { validateMustBe(sel.closest('form') || document); });
        });
        document.querySelectorAll('[data-radio-group][data-must-be] input[type="radio"]').forEach(function(r) {
            r.addEventListener('change', function() { validateMustBe(r.closest('form') || document); });
        });

        var forms = document.querySelectorAll('.saba-landing-form');
        forms.forEach(function(form) {
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                if (!validateMustBe(form)) return;
                if (_submitting) return;
                _submitting = true;

                var submitBtn = form.querySelector('[type="submit"]');
                var successMsg = document.querySelector('.saba-success-msg');
                var errorMsg = document.querySelector('.saba-error-msg');

                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Submitting...';
                }
                if (successMsg) successMsg.style.display = 'none';
                if (errorMsg) errorMsg.style.display = 'none';

                var formData = new FormData(form);
                var data = {};
                var filePromises = [];

                formData.forEach(function(value, key) {
                    if (value instanceof File && value.size > 0) {
                        if (value.size > 20 * 1024 * 1024) {
                            if (errorMsg) {
                                errorMsg.textContent = 'File too large (max 20 MB).';
                                errorMsg.style.display = 'block';
                            }
                            if (submitBtn) {
                                submitBtn.disabled = false;
                                submitBtn.textContent = 'Submit';
                            }
                            _submitting = false;
                            return;
                        }
                        filePromises.push(new Promise(function(resolve, reject) {
                            var reader = new FileReader();
                            reader.onload = function() {
                                data[key] = { filename: value.name, mime: value.type, size: value.size, data: reader.result };
                                resolve();
                            };
                            reader.onerror = reject;
                            reader.readAsDataURL(value);
                        }));
                    } else if (!(value instanceof File)) {
                        data[key] = value;
                    }
                });

                try {
                    await Promise.all(filePromises);

                    // Check if payment condition is met
                    var needsPayment = _payment.enabled && !_payment.already_paid;
                    if (needsPayment && _payment.condition_field) {
                        var condVal = data[_payment.condition_field] || '';
                        if (Array.isArray(condVal)) condVal = condVal.join(',');
                        needsPayment = String(condVal).toLowerCase() === String(_payment.condition_value).toLowerCase();
                    }

                    if (needsPayment) {
                        // Payment flow: redirect to Stripe Checkout
                        if (submitBtn) submitBtn.textContent = 'Redirecting to payment...';
                        var response = await fetch('/landing/{{ token }}/checkout', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });
                        if (response.ok) {
                            var result = await response.json();
                            window.location.href = result.checkout_url;
                        } else {
                            var err = await response.json();
                            if (errorMsg) {
                                errorMsg.textContent = err.error || 'Payment error. Please try again.';
                                errorMsg.style.display = 'block';
                            }
                            if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Retry'; }
                            _submitting = false;
                        }
                    } else {
                        // Normal flow: direct submission
                        var response = await fetch('/landing/{{ token }}', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });

                        if (response.ok) {
                            if (successMsg) {
                                successMsg.style.display = 'block';
                                successMsg.scrollIntoView({ behavior: 'smooth' });
                            }
                            form.reset();
                            setTimeout(function() { form.style.display = 'none'; }, 2000);
                        } else {
                            var err = await response.json();
                            if (errorMsg) {
                                errorMsg.textContent = err.error || 'Error saving data. Please try again.';
                                errorMsg.style.display = 'block';
                            }
                            if (submitBtn) {
                                submitBtn.disabled = false;
                                submitBtn.textContent = 'Submit';
                            }
                            _submitting = false;
                        }
                    }
                } catch (error) {
                    if (errorMsg) {
                        errorMsg.textContent = 'Connection error. Please try again.';
                        errorMsg.style.display = 'block';
                    }
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Submit';
                    }
                    _submitting = false;
                }
            });
        });

        // Gestione unsubscribe link (se presente)
        var unsubLinks = document.querySelectorAll('[data-saba-unsubscribe]');
        unsubLinks.forEach(function(link) {
            link.addEventListener('click', async function(e) {
                e.preventDefault();
                if (!confirm('Are you sure you want to unsubscribe?')) return;

                try {
                    var response = await fetch('/landing/{{ token }}/unsubscribe', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    if (response.ok) {
                        document.body.innerHTML = '<div style="text-align:center;padding:60px;font-family:sans-serif"><h2>Unsubscribed</h2><p>You will no longer receive messages.</p></div>';
                    }
                } catch (error) {
                    alert('An error occurred. Please try again.');
                }
            });
        });
    })();
    </script>
</body>
</html>
